<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Portal with 6-Month Expiry</title>
  
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    
    #login-screen { display: flex; justify-content: center; align-items: center; width: 100%; height: 100vh; }
    .login-card { background: #1e293b; padding: 35px; border-radius: 12px; width: 340px; text-align: center; border: 1px solid #334155; }
    .login-card input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
    .login-card button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    
    #dashboard { display: none; flex-direction: column; height: 100vh; width: 100%; }
    header { background: #1e293b; padding: 15px 30px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .nav-btn { background: #334155; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 8px; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }

    #catalog-view { padding: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; overflow-y: auto; }
    .course-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .course-card h3 { margin-bottom: 10px; }
    .course-card p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
    .badge-locked { background: #7f1d1d; color: #fca5a5; }
    .badge-unlocked { background: #065f46; color: #6ee7b7; }
    .badge-expired { background: #78350f; color: #fde68a; }
    .buy-btn { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    .open-btn { background: #16a34a; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }

    #player-view { display: none; flex-grow: 1; height: calc(100vh - 65px); }
    .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; }
    .video-list { overflow-y: auto; flex-grow: 1; }
    .video-item { padding: 15px 20px; border-bottom: 1px solid #334155; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
    .video-item:hover, .video-item.active { background: #334155; }
    
    .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 30px; gap: 15px; position: relative; }
    .player-container { background: #000; border-radius: 12px; overflow: hidden; position: relative; width: 100%; max-width: 900px; }
    
    video { width: 100%; display: block; user-select: none; -webkit-user-select: none; }
    
    #course-lock-overlay {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.96); z-index: 10; flex-direction: column;
      justify-content: center; align-items: center; text-align: center; padding: 30px;
    }
    #watch-lock-banner {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); color: #ef4444; flex-direction: column;
      justify-content: center; align-items: center; font-weight: bold; font-size: 18px; text-align: center; padding: 20px;
    }
    .badge { background: #334155; padding: 10px 15px; border-radius: 6px; max-width: 900px; font-size: 13px; color: #cbd5e1; }
  </style>
</head>
<body oncontextmenu="return false;">
  

  <div id="login-screen">
    <div class="login-card">
      <h2>Course Portal Login</h2>
      <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">Sign in or create account</p>
      <input type="email" id="email" placeholder="Student Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="handleAuth()">Sign In / Register</button>
      <p id="err-msg" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;"></p>
    </div>
  </div>

  <div id="dashboard">
    <header>
      <div>
        <button class="nav-btn" onclick="showCatalog()">📚 All Courses</button>
        <span id="user-display" style="font-size: 13px; color: #94a3b8;"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div id="catalog-view"></div>

    <div id="player-view">
      <div class="sidebar">
        <div class="sidebar-header">
          <h3 id="sidebar-course-title">Course Modules</h3>
        </div>
        <div class="video-list" id="videoList"></div>
      </div>

      <div class="main-content">
        <div id="course-lock-overlay">
          <h2 id="lock-title">🔒 This Course is Locked</h2>
          <p style="color: #94a3b8; margin: 10px 0 20px 0;" id="lock-price-text">Purchase to unlock video modules (Valid for 6 Months).</p>
          <button class="buy-btn" style="width: auto; padding: 12px 30px;" onclick="payWithRazorpay()">Pay with Razorpay to Unlock</button>
        </div>

        <h2 id="currentTitle">Select a module</h2>
        
        <div class="player-container">
          <video id="courseVideo" controls controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false;"></video>
          
          <div id="watch-lock-banner">
            ⚠️ 1.8x Watch Limit Exceeded
            <span style="font-size: 13px; color: #94a3b8; margin-top: 8px; font-weight: normal;">
              You have used your maximum watch limit for this video.
            </span>
          </div>
        </div>

        <div class="badge" id="watchStats">Remaining Watch Time: -- / --</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyAgmdaIEqo9jjispJgRZO_HksMzCEkDZJ4",
      authDomain: "course-1e801.firebaseapp.com",
      projectId: "course-1e801",
      storageBucket: "course-1e801.firebasestorage.app",
      messagingSenderId: "140585295435",
      appId: "1:140585295435:web:7733e65f94c1c7cc1737ce",
      measurementId: "G-ELPYP6H10E"
    };

    // RAZORPAY TEST KEY
    const RAZORPAY_KEY_ID = "rzp_test_TRZUTqu2phk18H";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const courses = [
      {
        id: "course_web_dev",
        title: "Fullstack Web Development",
        description: "Master HTML, CSS, JavaScript and backend basics.",
        priceDisplay: "₹499",
        amountInPaise: 49900,
        videos: [
          { id: "wd_v1", title: "01. Fullstack Introduction", src: "https://github.com/pravinganeshhawle01-wq/course-videos/releases/download/v1/i_want_animated_card_text_rev.1.mp4" },
          { id: "wd_v2", title: "02. Building UI Layouts", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" }
        ]
      },
      {
        id: "course_python",
        title: "Python Data Science",
        description: "Learn Python, Pandas, Data Visualization & Analysis.",
        priceDisplay: "₹799",
        amountInPaise: 79900,
        videos: [
          { id: "py_v1", title: "01. Python Setup", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4" }
        ]
      }
    ];

    let currentUser = null;
    let userPurchases = [];
    let userPurchaseDates = {};
    let userWatchHistory = {};
    let activeCourse = null;
    let activeVideo = null;
    let lastTime = 0;
    let syncTimer = null;

    const SIX_MONTHS_MS = 180 * 24 * 60 * 60 * 1000;
    const player = document.getElementById('courseVideo');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-display').innerText = user.email;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        await loadUserData();
        showCatalog();
      } else {
        currentUser = null;
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    window.handleAuth = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const errEl = document.getElementById('err-msg');
      errEl.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, pass);
          } catch (createErr) {
            errEl.innerText = createErr.message;
            errEl.style.display = 'block';
          }
        } else {
          errEl.innerText = err.message;
          errEl.style.display = 'block';
        }
      }
    };

    window.logout = () => signOut(auth);

    async function loadUserData() {
      if (!currentUser) return;
      const userRef = doc(db, "users", currentUser.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists()) {
        const data = userSnap.data();
        userPurchases = data.purchasedCourses || [];
        userPurchaseDates = data.purchaseDates || {};
      } else {
        userPurchases = [];
        userPurchaseDates = {};
      }

      const historyRef = doc(db, "watch_history", currentUser.uid);
      const historySnap = await getDoc(historyRef);
      userWatchHistory = historySnap.exists() ? historySnap.data() : {};
    }

    function getAccessStatus(courseId) {
      if (!userPurchases.includes(courseId)) return "LOCKED";
      
      const purchaseTime = userPurchaseDates[courseId];
      if (!purchaseTime) return "UNLOCKED";

      const isExpired = (Date.now() - purchaseTime) > SIX_MONTHS_MS;
      return isExpired ? "EXPIRED" : "UNLOCKED";
    }

    window.showCatalog = () => {
      document.getElementById('catalog-view').style.display = 'grid';
      document.getElementById('player-view').style.display = 'none';
      player.pause();

      const container = document.getElementById('catalog-view');
      container.innerHTML = '';

      courses.forEach(c => {
        const status = getAccessStatus(c.id);
        const card = document.createElement('div');
        card.className = 'course-card';

        let badgeHtml = `<span class="status-badge badge-locked">Price: ${c.priceDisplay}</span>`;
        let buttonHtml = `<button class="buy-btn" onclick="openCourse('${c.id}')">Buy & Access (${c.priceDisplay})</button>`;

        if (status === "UNLOCKED") {
          badgeHtml = `<span class="status-badge badge-unlocked">Unlocked (6 Months Access)</span>`;
          buttonHtml = `<button class="open-btn" onclick="openCourse('${c.id}')">Watch Course</button>`;
        } else if (status === "EXPIRED") {
          badgeHtml = `<span class="status-badge badge-expired">Access Expired (6 Months Ended)</span>`;
          buttonHtml = `<button class="buy-btn" onclick="openCourse('${c.id}')">Renew Access (${c.priceDisplay})</button>`;
        }

        card.innerHTML = `
          <div>
            <h3>${c.title}</h3>
            <p>${c.description}</p>
            ${badgeHtml}
          </div>
          ${buttonHtml}
        `;
        container.appendChild(card);
      });
    };

    window.openCourse = (courseId) => {
      activeCourse = courses.find(c => c.id === courseId);
      document.getElementById('catalog-view').style.display = 'none';
      document.getElementById('player-view').style.display = 'flex';
      document.getElementById('sidebar-course-title').innerText = activeCourse.title;

      const status = getAccessStatus(activeCourse.id);
      const lockOverlay = document.getElementById('course-lock-overlay');

      if (status !== "UNLOCKED") {
        lockOverlay.style.display = 'flex';
        if (status === "EXPIRED") {
          document.getElementById('lock-title').innerText = "⏳ Course Access Expired";
          document.getElementById('lock-price-text').innerText = "Your 6-month validity for this course has ended. Renew now to continue watching.";
        } else {
          document.getElementById('lock-title').innerText = "🔒 This Course is Locked";
          document.getElementById('lock-price-text').innerText = `Purchase ${activeCourse.title} for ${activeCourse.priceDisplay} to get 6 months unlimited access.`;
        }
        player.pause();
      } else {
        lockOverlay.style.display = 'none';
      }

      renderVideoList();
      if (activeCourse.videos.length > 0) {
        loadVideo(activeCourse.videos[0]);
      }
    };

    window.payWithRazorpay = () => {
      if (!currentUser || !activeCourse) return;

      const options = {
        key: RAZORPAY_KEY_ID,
        amount: activeCourse.amountInPaise,
        currency: "INR",
        name: "Course Portal",
        description: `6 Months Access: ${activeCourse.title}`,
        prefill: { email: currentUser.email },
        theme: { color: "#2563eb" },
        handler: async function (response) {
          await unlockCourseInFirestore(activeCourse.id, response.razorpay_payment_id);
        }
      };

      const rzp = new window.Razorpay(options);
      rzp.open();
    };

    async function unlockCourseInFirestore(courseId, paymentId) {
      const userRef = doc(db, "users", currentUser.uid);
      
      await setDoc(userRef, {
        purchasedCourses: arrayUnion(courseId),
        purchaseDates: {
          [courseId]: Date.now()
        },
        lastPaymentId: paymentId
      }, { merge: true });

      if (!userPurchases.includes(courseId)) userPurchases.push(courseId);
      userPurchaseDates[courseId] = Date.now();

      document.getElementById('course-lock-overlay').style.display = 'none';
      showCatalog();
      alert(`Payment Successful! You now have 6 months access to ${activeCourse.title}.`);
    }

    function renderVideoList() {
      const list = document.getElementById('videoList');
      list.innerHTML = '';

      activeCourse.videos.forEach(v => {
        const watched = userWatchHistory[v.id] || 0;
        const item = document.createElement('div');
        item.className = `video-item ${activeVideo && activeVideo.id === v.id ? 'active' : ''}`;
        item.id = `item-${v.id}`;
        item.innerHTML = `
          <span>${v.title}</span>
          <span style="font-size:11px; color:#94a3b8;" id="status-${v.id}">Watched: ${Math.floor(watched)}s</span>
        `;
        item.onclick = () => loadVideo(v);
        list.appendChild(item);
      });
    }

    function loadVideo(video) {
      activeVideo = video;
      document.querySelectorAll('.video-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${video.id}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('currentTitle').innerText = video.title;
      player.src = video.src;
      document.getElementById('watch-lock-banner').style.display = 'none';

      player.onloadedmetadata = () => {
        lastTime = player.currentTime;
        updateWatchStats();
      };
    }

    player.addEventListener('play', () => { lastTime = player.currentTime; });

    player.addEventListener('timeupdate', () => {
      const status = getAccessStatus(activeCourse.id);
      if (!player.paused && activeVideo && status === "UNLOCKED") {
        let diff = player.currentTime - lastTime;
        if (diff > 0 && diff < 1) {
          userWatchHistory[activeVideo.id] = (userWatchHistory[activeVideo.id] || 0) + diff;
          if (!syncTimer) {
            syncTimer = setTimeout(syncWatchHistory, 4000);
          }
        }
        lastTime = player.currentTime;

        const maxAllowed = player.duration * 1.8;
        const totalWatched = userWatchHistory[activeVideo.id] || 0;

        updateWatchStats();

        if (totalWatched >= maxAllowed) {
          player.pause();
          document.getElementById('watch-lock-banner').style.display = 'flex';
          syncWatchHistory();
        }
      }
    });

    async function syncWatchHistory() {
      if (!currentUser) return;
      const ref = doc(db, "watch_history", currentUser.uid);
      await setDoc(ref, userWatchHistory, { merge: true });
      syncTimer = null;
    }

    function updateWatchStats() {
      if (!player.duration || !activeVideo) return;
      const totalWatched = userWatchHistory[activeVideo.id] || 0;
      const maxAllowed = player.duration * 1.8;
      const remaining = Math.max(0, maxAllowed - totalWatched);

      document.getElementById('watchStats').innerText = 
        `Total Watched: ${Math.floor(totalWatched)}s / Max Limit (1.8x): ${Math.floor(maxAllowed)}s (Remaining: ${Math.floor(remaining)}s)`;
    }
  </script>
  
</body>
</html>
